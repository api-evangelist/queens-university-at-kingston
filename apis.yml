description: >-
  Queen's University at Kingston is a public research university in Kingston, Ontario, Canada — a member
  of the U15 group of Canadian research universities, serving more than 25,000 students. Its
  machine-readable footprint is small, and stating it honestly matters more than inflating it: Queen's
  operates no public developer portal, no institution-run open-data API, and no published course,
  timetable, or registrar contract. api.queensu.ca, developer.queensu.ca and data.queensu.ca do not
  resolve. What Queen's genuinely operates and publishes on its own domain is federated identity — a
  Shibboleth Identity Provider serving SAML 2.0 metadata at login.queensu.ca — and an authored llms.txt
  directing AI agents to official sources. Its two research-data surfaces are real institutional facts
  but are tenant deployments, not Queen's engineering: QSpace, the institutional repository, now runs as
  DSpace 8.4 on Scholaris, the shared service of the Ontario Council of University Libraries, and the
  Queen's University Dataverse Collection lives inside Borealis, the national Dataverse operated by
  Scholars Portal. Both expose live REST and OAI-PMH interfaces, and both contracts belong to their
  platforms. An earlier profile of this repository carried 36 OpenAPI definitions titled after Queen's;
  every one of them was the Dataverse product's own contract, and they have been removed.
