x-coverage:
  state: none
  reason: tenant_only
  detail: >-
    Queen's operates no public API of its own. Every callable surface reachable under its name is a
    tenant deployment on a shared Ontario or Canadian platform: QSpace runs as DSpace 8.4 on Scholaris
    (OCUL / Scholars Portal) after qspace.library.queensu.ca was redirected to queensu.scholaris.ca, and
    the Queen's University Dataverse Collection runs inside Borealis (Scholars Portal). Library
    discovery is Ex Libris Primo on the OCUL shared instance. Two surfaces ARE genuinely Queen's own and
    are recorded as such: the Shibboleth / SAML 2.0 IdP metadata at login.queensu.ca, and a substantive
    authored llms.txt at www.queensu.ca. The one previously catalogued open-data API, the
    student-built Qmulus project, is dead — api.qmulus.io and manage.qmulus.io return NXDOMAIN and its
    GitHub org has not been pushed to since January 2023 — so its landing page is kept only as a
    CourseCatalog pointer and it is no longer listed as an API. No institution-operated OpenAPI exists,
    and none was generated; 36 previously stored specs were the Dataverse product's contract and were
    removed with everything derived from them.
