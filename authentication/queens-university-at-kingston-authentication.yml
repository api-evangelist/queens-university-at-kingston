note: >-
  Queen's publishes no public API key, OAuth application registration, or developer credential flow of
  its own — there is no institution-operated public API to authenticate against. What it does operate,
  and publish machine-readably, is federated identity: a Shibboleth Identity Provider on its own domain
  serving SAML 2.0 metadata. That is the institution's real authentication surface and the one recorded
  here. The token flows of its repository tenants belong to the platforms that run them (DSpace on
  Scholaris, Dataverse on Borealis) and are not restated as Queen's own.
