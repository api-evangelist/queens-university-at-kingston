  detail: >-
    IdP metadata is served as application/xml at a stable, unauthenticated URL, carrying an
    IDPSSODescriptor, an X509 signing certificate, and a shibmd:Scope of queensu.ca. This is the
    credential surface every federated Queen's service — including its repository tenants — resolves to.
- name: DSpace REST API authentication (QSpace on Scholaris)
  type: multiple
  x-operator: tenant
  documented: true
  detail: >-
    The Queen's institutional repository REST API answers unauthenticated requests with
    `WWW-Authenticate: password realm="DSpace REST API", shibboleth realm="DSpace REST API",
    ip realm="DSpace REST API"` and a Shibboleth login location. Read access to public records needs no
    credential at all. The scheme is DSpace's, deployed by OCUL / Scholars Portal.
  evidence:
  - url: https://queensu.scholaris.ca/server/api/authn/status
    locator: WWW-Authenticate response header
- name: Dataverse API token (Queen's collection on Borealis)
  type: apiKey
  x-operator: tenant
  documented: true
  detail: >-
    Deposit and management operations against the Queen's University Dataverse Collection use a
    Dataverse API token passed in the X-Dataverse-key header. Tokens are issued by Borealis, not by
