  - date: '2026-08-30'
    rating: 2
    summary: >-
      Re-profiled under the university pipeline's operator axis, and the rating is DOWN on purpose. The
      June review credited Queen's with a large API footprint that it does not have: 36 OpenAPI
      definitions titled "Queen's University at Kingston <tag> API" were the Dataverse product's own
      contract (info.title "Dataverse API", v6.8.1-SP) served from borealisdata.ca, a national platform
      run by Scholars Portal, and eight other institutions ship the same titles. Those 36 specs and the
      121 files derived from them were removed. Two corrections to the June record: QSpace has MOVED —
      qspace.library.queensu.ca now 301-redirects to queensu.scholaris.ca, a DSpace 8.4 tenant on the
      OCUL/Scholars Portal Scholaris service, so the one host previously read as institution-owned is
      not one; and Qmulus is dead, not merely unresolved — api.qmulus.io and manage.qmulus.io return
      NXDOMAIN and the GitHub org's last push was January 2023. Two genuinely institution-operated
      machine-readable surfaces were found that the June review missed: SAML 2.0 Shibboleth IdP metadata
      at login.queensu.ca, and an authored 9.5KB llms.txt at www.queensu.ca.
    endpoints:
