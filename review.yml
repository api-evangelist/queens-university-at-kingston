  - date: '2026-06-03'
    rating: 3
    summary: >-
      Queen's has a meaningful but mostly community/library-run API footprint
      rather than a single official developer portal. Qmulus (community open
      data) has live docs and landing pages but its api.qmulus.io host did not
      resolve during review and token signup is gated to @queensu.ca emails. The
      QSpace DSpace repository and the Queen's Dataverse on Borealis both expose
      live REST and OAI-PMH interfaces verified live. No endpoints were
      fabricated; gated and non-resolving surfaces are flagged as such.
